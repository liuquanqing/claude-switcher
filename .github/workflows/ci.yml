name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Standard Intel pool: macOS arm64 jobs failed to acquire a hosted runner.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Core tests with synthetic data
        run: swift test
      - name: Isolated controller checks
        run: scripts/test-controller.sh
      - name: Build and verify signatures
        run: ./build.sh
