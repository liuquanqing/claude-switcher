name: LuLu official integration gate (read-only isolated research)
on:
  push:
    branches: [codex/lulu-integration-lab-20261101]
permissions:
  contents: read
jobs:
  lulu-readonly-validation:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Official binary signature gate, no installation or activation
        env:
          CS_LULU_LAB: read-only-official-binary
          CS_LULU_RESULT_DIR: ${{ runner.temp }}/lulu-results
        run: python3 research/lulu-integration-lab/run_disposable.py
      - name: Preserve exact-source and signature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lulu-integration-evidence
          path: ${{ runner.temp }}/lulu-results/
          retention-days: 14
