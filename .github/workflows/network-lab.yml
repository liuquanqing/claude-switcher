name: Isolated macOS network experiment
on:
  push:
    branches: [codex/network-isolation-lab]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable runner only - dual stack loopback PF experiment
        env:
          CS_DISPOSABLE_NETWORK_LAB: github-hosted-loopback-only
        run: python3 research/network-lab/macos_pf_probe.py
      - name: Disposable runner only - control loss and expiring permit
        env:
          CS_DISPOSABLE_NETWORK_LAB: github-hosted-loopback-only
        run: python3 research/network-lab/gate_lease_lab.py
      - name: Disposable runner only - PF plus expiring data-path permit
        env:
          CS_DISPOSABLE_NETWORK_LAB: github-hosted-loopback-only
        run: python3 research/network-lab/gate_kernel_macos_lab.py
      - name: Disposable runner only - real utun UDP and PF fallback experiment
        run: |
          clang -Wall -Wextra research/network-lab/utun_launch.c -o "$RUNNER_TEMP/utun-launch"
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted CS_REAL_UTUN_LAB=ephemeral-only "$RUNNER_TEMP/utun-launch" "$(command -v python3)" "$PWD/research/network-lab/real_utun_probe.py"
  official-clients:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable runner only - official blank clients and local fixtures
        run: |
          clang -Wall -Wextra research/network-lab/utun_launch.c -o research/network-lab/utun-launch
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted CS_OFFICIAL_CLIENT_LAB=ephemeral-only CS_TEST_UID="$(id -u)" RUNNER_TEMP="$RUNNER_TEMP" "$(command -v python3)" "$PWD/research/network-lab/official_clients_probe.py"
