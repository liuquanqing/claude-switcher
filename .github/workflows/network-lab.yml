name: Independent stock proxy core and PF failure experiment
on:
  push:
    branches: [codex/network-isolation-lab]
permissions:
  contents: read
jobs:
  stock-core-pf:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable hosted Mac only - independent stock TUN and PF executor
        run: |
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted CS_STOCK_CORE_LAB=ephemeral-only RUNNER_TEMP="$RUNNER_TEMP" CS_STOCK_RESULT="$RUNNER_TEMP/stock-core-results.json" "$(command -v python3)" "$PWD/research/network-lab/stock_core_pf_probe.py"
      - name: Preserve synthetic experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-core-evidence
          path: ${{ runner.temp }}/stock-core-results.json
          retention-days: 7
