name: Isolated macOS network experiment
on:
  push:
    branches: [codex/network-isolation-lab]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable runner only - dual stack loopback PF experiment
        env:
          CS_DISPOSABLE_NETWORK_LAB: github-hosted-loopback-only
        run: python3 research/network-lab/macos_pf_probe.py
      - name: Disposable runner only - control loss and expiring permit
        env:
          CS_DISPOSABLE_NETWORK_LAB: github-hosted-loopback-only
        run: python3 research/network-lab/gate_lease_lab.py
