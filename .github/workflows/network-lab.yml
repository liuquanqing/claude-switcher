name: Isolated official-client utun permit composition
on:
  push:
    branches: [codex/network-isolation-lab]
permissions:
  contents: read
jobs:
  composition-clients:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable runner only - official clients with leased actual utun executor
        run: |
          clang -Wall -Wextra research/network-lab/utun_launch.c -o research/network-lab/utun-launch
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted CS_OFFICIAL_CLIENT_LAB=ephemeral-only CS_UTUN_COMPOSITION_LAB=ephemeral-only CS_TEST_UID="$(id -u)" RUNNER_TEMP="$RUNNER_TEMP" "$(command -v python3)" "$PWD/research/network-lab/official_clients_probe.py"
